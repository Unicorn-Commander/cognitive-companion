[package]
name = "cognitive-companion"
version = "0.1.0"
description = "AI companion with character interaction"
authors = ["SkyBehind <aaron@magicunicorn.tech>"]
license = "MIT"
repository = "https://github.com/Unicorn-Commander/cognitive-companion"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "global-shortcut-all", "shell-execute", "process-exit", "process-relaunch", "shell-sidecar", "fs-all", "notification-all", "dialog-all", "shell-open", "path-all", "system-tray", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
